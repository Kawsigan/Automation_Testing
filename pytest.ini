[pytest]
# Minimum Pytest version required
minversion = 8.0

# Directory paths to discover tests
testpaths = tests

# Test file, class, and function naming conventions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default CLI execution arguments
addopts = 
    -v
    --strict-markers
    --capture=no
    --html=reports/report.html
    --self-contained-html

# Custom test markers for categorized execution
markers =
    smoke: Quick sanity verification of core workflows
    regression: Comprehensive end-to-end regression test suite
    auth: Authentication and login test scenarios
    dashboard: Dashboard navigation and session management tests
    users: User management and role assignment tests
    assets: Asset and location management tests
    maintenance: Breakdown and preventive maintenance tests
    procurement: Purchase order and BOM request tests
    settings: System configuration and prefix tests
    kaizen: Continuous improvement and suggestion tests
    five_s: 5S audit and template tests
    poka_yoke: Mistake proofing module tests
    amc_warranty: AMC and warranty tracking tests
    reports: Analytics and maintenance report tests
    floor_plan: Floor plan and spatial layout tests
    masters: System masters and lookup configuration tests
    load: Load and performance benchmark tests

# Live CLI logging format
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
